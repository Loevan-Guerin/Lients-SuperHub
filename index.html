/* ---------- nouvelle sortie ---------- */
function delRel(){ask('Voulez-vous vraiment supprimer la nouvelle sortie ?',()=>{save({release:null});page()})}
async function getRel(){let u=$('rl').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;
 let t='',c='',au='';const q=encodeURIComponent(u);
 const yt=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
 try{if(u.includes('spotify')){const j=await(await fetch('https://open.spotify.com/oembed?url='+q)).json();t=j.title||'';c=j.thumbnail_url||''}
 else{const j=await(await fetch('https://noembed.com/embed?url='+q)).json();t=j.title||'';c=j.thumbnail_url||'';au=j.author_name||''}}catch(e){}
 if(yt)c='https://i.ytimg.com/vi/'+yt[1]+'/mqdefault.jpg';
 if(!t&&!c){toast('Impossible de lire ce lien');return}
 save({release:{label:'Nouvelle sortie',title:t,artist:au||A.name||'',cover:c,url:u}});addRel=0;page()}
/* ---------- liens ---------- */
function addL(){let u=$('nl').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;const s=u.toLowerCase(),m=MAP.find(x=>s.includes(x[0]));
 save({links:[...A.links,m?{k:m[1],n:m[2],u:u,z:m[3]}:{k:'gen',n:(()=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return 'Mon site'}})(),u:u,z:'btn'}]});page()}
function lkf(f){const L=[...A.links];f(L);save({links:L});cm();page()}
function mv(i,d){lkf(L=>{let j=i+d;while(L[j]&&L[j].z!==L[i].z)j+=d;if(!L[j])return;[L[i],L[j]]=[L[j],L[i]]})}
function zn(i){lkf(L=>{L[i]={...L[i],z:L[i].z==='btn'?'ico':'btn'}})}
function saveL(i){lkf(L=>{L[i]={...L[i],n:$('en').value,u:$('eu').value}})}
function delL(i){const n=A.links[i].n;cm();ask('Voulez-vous vraiment supprimer votre bouton '+esc(n)+' ?',()=>lkf(L=>{L.splice(i,1)}))}
function editL(i){const l=A.links[i];mod('<h3>Modifier le lien</h3><label>Nom affiché</label><input id="en" value="'+esc(l.n)+'"><label>Adresse du lien</label><input id="eu" value="'+esc(l.u)+'"><div class="bt"><button onclick="mv('+i+',-1)">↑ Monter</button><button onclick="mv('+i+',1)">↓ Descendre</button><button onclick="zn('+i+')">'+(l.z==='btn'?'Passer en icône':'Passer en bouton')+'</button></div><a class="dl" href="'+esc(l.u)+'" target="_blank" rel="noopener">Ouvrir le lien</a><button class="dl" onclick="delL('+i+')"><span class="ic m">'+MIN+'</span>Supprimer ce lien</button><div class="bt"><button onclick="cm()">Annuler</button><button class="pr" onclick="saveL('+i+')">Enregistrer</button></div>')}
/* ---------- page artiste (visiteur + admin) ---------- */
function page(){
 const adm=mode==='adm',R=A.release,L=A.links;
 document.title=A.name||'LIENTS SUPER HUB';if(adm)noidx();
 const E=adm?' contenteditable="true" onblur="sv(this)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}"':'';
 const it=(l,i)=>'<div class="it"><a class="lk" '+(adm?'href="#" onclick="editL('+i+');return false"':'href="'+esc(l.u||'#')+'" target="_blank" rel="noopener"')+'>'+(l.k==='gen'?fav(l.u):(ICON[l.k]||ICON.gen))+(l.z==='btn'?'<span class="'+(NC[l.k]||'n-gen')+'">'+esc(l.n)+'</span>':'')+'</a></div>';
 const bt=L.map((l,i)=>l.z==='btn'?it(l,i):'').join(''),ic=L.map((l,i)=>l.z==='ico'?it(l,i):'').join('')+(A.contact_email?'<div class="it"><a class="lk" href="mailto:'+esc(A.contact_email)+'">'+ICON.mail+'</a></div>':'');
 let h='<button class="ic nb share" onclick="share()">'+SH+'</button>';
 if(adm)h+='<button class="ic bgpen" onclick="tm(2)">'+PEN+'</button>'+(menu==2?'<div class="fm" style="top:calc(14px + env(safe-area-inset-top));left:56px">'+mn(2)+'</div>':'')+'<div class="sl"><span>Flou</span><input type="range" min="0" max="100" value="'+A.blur+'" oninput="bl(this.value)" onchange="save({blur:+this.value})"></div>';
 h+='<main class="'+(adm?'adm ':'')+(R?'':'list')+'"><div class="rel av"><div id="av" class="avatar"></div>'+(adm?'<button class="ic" onclick="tm(1)">'+PEN+'</button>':'')+'</div>'+(menu==1?mn(1):'');
 if(adm||A.name)h+='<div class="nmw"><h1 id="nm" class="ph'+(adm?' ed':'')+'" data-ph="Ton nom" data-k="name"'+E+'>'+esc(A.name)+'</h1></div>';
 if(adm||A.description)h+='<div><p class="desc ph'+(adm?' ed':'')+'" data-ph="Courte description" data-k="description"'+E+'>'+esc(A.description)+'</p></div>';
 if(adm)h+='<div><span id="em" class="mail ph ed" data-ph="Ton e-mail" data-k="contact_email"'+E+'>'+esc(A.contact_email)+'</span></div>';
 else if(A.contact_email)h+='<a class="mail" href="mailto:'+esc(A.contact_email)+'">'+esc(A.contact_email)+'</a>';
 if(R)h+='<hr class="sep" style="margin:18px 30px 0">';
 if(R)h+='<div class="release'+(R.cover&&R.cover.includes('ytimg.com')?' wide':'')+'"><div class="lab ph'+(adm?' ed':'')+'" data-ph="Titre de la section" data-k="rel.label"'+E+'>'+esc(R.label)+'</div><div class="rel"><a '+(R.url?'href="'+esc(R.url)+'" target="_blank" rel="noopener"':'')+'>'+(R.cover?'<img class="cover" src="'+esc(R.cover)+'" alt="">':'<div class="cover"></div>')+'</a>'+(adm?'<button class="ic m x" onclick="delRel()">'+MIN+'</button>':'')+'</div><a '+(R.url?'href="'+esc(R.url)+'" target="_blank" rel="noopener"':'')+'>'+(R.title?'<div class="rtitle">'+esc(R.title)+'</div>':'')+(R.artist?'<div class="rartist">'+esc(R.artist)+'</div>':'')+'</a></div>';
 else if(adm)h+=addRel?'<div class="row2"><input id="rl" placeholder="Coller le lien Spotify, YouTube…"><button class="btn" onclick="getRel()">Récupérer</button></div>':'<button class="add" onclick="addRel=1;page()"><i>+</i>Nouvelle sortie</button>';
 if(bt||adm)h+='<div class="music" style="margin-top:'+(R?22:30)+'px">'+bt+'</div>';
 if(bt&&ic)h+='<hr class="sep">';
 if(ic)h+='<div class="soc">'+ic+'</div>';
 if(adm)h+='<div class="row2"><input id="nl" placeholder="Coller un lien (Spotify, Instagram…)"><button class="btn" onclick="addL()">Ajouter</button></div>';
 $('app').innerHTML=h+'</main>'+FT;
 if(A.photo_url)$('av').style.backgroundImage='url("'+A.photo_url+'")';
 fx()}
/* ---------- super-admin ---------- */
async function superPage(){noidx();const {data}=await sb.auth.getSession();bgDef();if(data.session)return list();
 $('app').innerHTML='<div class="gate"><h2>Connexion super-admin</h2><input id="em" type="email" placeholder="Ton e-mail"><input id="pw" type="password" placeholder="Mot de passe"><button class="btn" onclick="login()">Entrer</button></div>'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){toast('Identifiants incorrects');return}list()}
async function list(){bgDef();const {data,error}=await sb.from('artists').select('id,public_slug,admin_slug,name').order('created_at',{ascending:false});if(error){toast('Accès refusé');return}
 AR=data;let h='<main class="sup"><h2>Pages artistes</h2><button class="srow" onclick="artForm(-1)"><span>Créer un nouvel artiste</span><span class="ic">+</span></button>';
 data.forEach((a,i)=>{h+='<div class="srow"><div>'+esc(a.name||a.public_slug)+'<small>/'+esc(a.public_slug)+'</small></div><div class="gp"><button class="ic" onclick="cpRow('+i+')">'+CP+'</button><button class="ic" onclick="window.open(\'/\'+AR['+i+'].admin_slug)">'+OP+'</button><button class="ic" onclick="artForm('+i+')">'+PEN+'</button></div></div>'});
 $('app').innerHTML=h+'<button class="btn" style="margin-top:18px;padding:12px" onclick="sb.auth.signOut().then(()=>location.reload())">Se déconnecter</button></main>'}
function sl(el){el.value=el.value.toLowerCase().replace(/[^a-z0-9-]/g,'')}
function artForm(i){const a=i<0?{public_slug:'',admin_slug:''}:AR[i];
 mod('<h3>'+(i<0?'Créer un nouvel artiste':'Modifier l’artiste')+'</h3><label>Page publique</label><input id="ap" value="'+esc(a.public_slug)+'" placeholder="nom-de-l’artiste" oninput="sl(this);ck('+i+')"><label>Page admin</label><input id="aa" value="'+esc(a.admin_slug)+'" placeholder="adresse-admin" oninput="sl(this);ck('+i+')"><label>Code admin</label><input id="ac2" placeholder="'+(i<0?'Code (4 caractères minimum)':'Nouveau code (vide = inchangé)')+'" oninput="ck('+i+')"><button class="btn" id="cpi" onclick="cpInfo()" disabled style="opacity:.4">Copier le lien admin et le code</button>'+(i<0?'':'<button class="dl" onclick="delA('+i+')"><span class="ic m">'+MIN+'</span>Supprimer la page de l’artiste</button>')+'<div class="bt"><button onclick="cm()">Annuler</button><button class="pr" onclick="saveA('+i+')">'+(i<0?'Créer':'Enregistrer')+'</button></div>');ck(i)}
function ck(i){const p=$('ap').value,a=$('aa').value,c=$('ac2').value;const dup=AR.some((r,j)=>j!==i&&(r.public_slug===p||r.admin_slug===p||r.public_slug===a||r.admin_slug===a));const ok=p&&a&&c.length>=4&&p!==a&&!dup;const b=$('cpi');b.disabled=!ok;b.style.opacity=ok?1:.4}
function cpInfo(){navigator.clipboard.writeText('Ton espace admin : '+location.origin+'/'+$('aa').value+'\nCode : '+$('ac2').value);toast('Lien admin et code copiés')}
function cpRow(i){navigator.clipboard.writeText(location.origin+'/'+AR[i].admin_slug);toast('Lien admin copié')}
async function saveA(i){const p=$('ap').value,a=$('aa').value,c=$('ac2').value;
 const r=i<0?await sb.rpc('super_create_artist',{p_pub:p,p_adm:a,p_code:c}):await sb.rpc('super_update_artist',{p_id:AR[i].id,p_pub:p,p_adm:a,p_code:c||null});
 if(r.error){toast(r.error.message);return}cm();list()}
function delA(i){const a=AR[i];cm();ask('Supprimer la page de l’artiste '+esc(a.public_slug)+' ? Entrez son code admin pour confirmer.',async c=>{const r=await sb.rpc('super_delete_artist',{p_id:a.id,p_code:c||''});if(r.data)list();else toast('Code incorrect')},true)}
</script></body></html>
